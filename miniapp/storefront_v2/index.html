<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090c"><meta name="color-scheme" content="dark"><title>SBAND · Маркет</title><link rel="icon" href="/assets/sband.png"><link rel="stylesheet" href="/store-assets/app.css?v=20261113-ui2"><script src="https://telegram.org/js/telegram-web-app.js" defer></script><script src="/assets/ui.js?v=20261113-ui2" defer></script><script src="/store-assets/app.js?v=20261113-ui2" defer></script><link rel="stylesheet" href="/assets/ui.css?v=20261113-ui2"></head><body>
